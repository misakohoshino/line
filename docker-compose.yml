services:
    matrix-line:
        image: ghcr.io/misakohoshino/line:latest
        volumes:
            - ./data:/data
        environment:
            DIVA_WEBHOOK_URL: http://diva-worker:8080/line/inbound
            # DIVA outbound endpoint (POST /diva/v1/send). Stays off unless a
            # token of at least 32 characters is set, e.g. in .env.
            DIVA_CONTROL_TOKEN: ${DIVA_CONTROL_TOKEN:-}
            DIVA_CONTROL_LISTEN: ":8090"
        # Docker internal network only. Never publish this port with `ports:`.
        expose:
            - "8090"
        depends_on:
            - diva-worker
        restart: unless-stopped

    diva-worker:
        image: python:3.13-slim
        working_dir: /app
        command: ["python", "-u", "/app/diva_worker.py"]
        volumes:
            - ./diva_worker.py:/app/diva_worker.py:ro
        expose:
            - "8080"
        restart: unless-stopped

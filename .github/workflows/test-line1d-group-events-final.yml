name: Test LINE-1D Group Events Final

on:
  push:
    branches:
      - feat/line1d-group-events-20261005

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run full connector tests
        run: go test ./pkg/connector -count=1
      - name: Run connector vet
        run: go vet ./pkg/connector/

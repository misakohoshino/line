name: Test LINE-1D Group Events

on:
  push:
    branches:
      - feat/line1d-group-events-20261005

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Patch pre-existing baseline test syntax only in runner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pkg/connector/handle_message_test.go")
          s = p.read_text()
          bad = 'if got := msg.ContentMetadata["nested"]; got != "{"kind":"voice"}" {'
          good = 'if got := msg.ContentMetadata["nested"]; got != `{"kind":"voice"}` {'
          if bad not in s:
              raise SystemExit("baseline syntax marker not found")
          p.write_text(s.replace(bad, good, 1))
          PY
      - name: Run targeted connector tests
        run: go test ./pkg/connector -run 'TestDIVAV2LiveGroupEvent|TestHandleDIVAGroupOperation|TestDIVAV2Golden' -count=1

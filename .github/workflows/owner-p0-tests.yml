name: OWNER P0/P1/P2 safety tests

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'issue_comment' && github.event.comment.id || github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request &&
         startsWith(github.event.comment.body, '/test ') &&
         (github.event.comment.user.login == github.repository_owner ||
          github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR'))
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR and requested Go test files
        if: ${{ github.event_name == 'issue_comment' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_TEXT: ${{ github.event.comment.body }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess, sys
          parts = os.environ["COMMENT_TEXT"].strip().split()
          files = parts[1:]
          if (not parts or parts[0] != "/test" or not 1 <= len(files) <= 40
                  or any(not re.fullmatch(r"pkg/(?:[A-Za-z0-9_]+/)*[A-Za-z0-9_]+_test\.go", x) for x in files)):
              sys.exit("Use /test pkg/connector/example_test.go [pkg/line/example_test.go ...]")
          number = os.environ["PR_NUMBER"]
          if not re.fullmatch(r"[1-9][0-9]*", number):
              sys.exit("Invalid PR number")
          repo = os.environ["GITHUB_REPOSITORY"]
          data = json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/pulls/{number}"]))
          if (data["state"] != "open" or data["base"]["ref"] != "main"
                  or data["head"]["repo"]["full_name"] != repo):
              sys.exit("PR must be open, target main, and use a branch in this repo")
          with open(os.environ["GITHUB_ENV"], "a") as out:
              out.write(f'PR_HEAD_SHA={data["head"]["sha"]}\n')
              out.write('TEST_TARGETS=' + ' '.join(files) + '\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD_SHA || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Install libolm
        run: sudo apt-get update && sudo apt-get install -y libolm-dev
      - name: Run only tests declared in selected Go files
        if: ${{ github.event_name == 'issue_comment' }}
        env:
          TEST_TARGETS: ${{ env.TEST_TARGETS }}
        run: |
          python - <<'PY'
          import collections, os, pathlib, re, subprocess, sys
          targets = os.environ["TEST_TARGETS"].split()
          if not 1 <= len(targets) <= 40:
              sys.exit("No explicitly selected tests")
          packages = collections.defaultdict(set)
          for filename in targets:
              path = pathlib.Path(filename)
              if not path.is_file():
                  sys.exit(f"Requested test file not found in PR: {filename}")
              names = re.findall(r"(?m)^func\s+(Test[A-Za-z0-9_]+)\s*\(\s*\w+\s+\*testing\.T", path.read_text())
              names = [n for n in names if n != "TestMain"]
              if not names:
                  sys.exit(f"No runnable Go Test functions in {filename}")
              packages["./" + path.parent.as_posix()].update(names)
          for package, names in packages.items():
              pattern = "^(" + "|".join(re.escape(n) for n in sorted(names)) + ")$"
              subprocess.run(["go", "test", "-race", package, "-run", pattern, "-count=1"], check=True)
          PY
      - name: Formatting
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: test -z "$(gofmt -l pkg/connector/diva_inbound_auth*.go pkg/connector/diva_owner*.go pkg/connector/diva_control.go pkg/line/methods.go pkg/line/profile*.go)"
      - name: Inbound / protocol / E2EE legacy manual regression
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: go test -race ./pkg/connector ./pkg/line ./pkg/e2ee
      - name: Vet handwritten packages
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: go vet $(go list ./... | grep -v /ltsm)
      - name: Build bridge
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: go build -o /tmp/matrix-line ./cmd/matrix-line
